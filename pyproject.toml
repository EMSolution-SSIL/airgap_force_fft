[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "airgap-force-fft"
version = "0.1.0"
description = "2-D FFT postprocessor for motor air-gap flux density and Maxwell stress."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Science Solutions International Laboratory, Inc." },
]
keywords = ["air-gap", "FFT", "Maxwell-stress", "motor", "EMSolution"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy",
  "pandas",
  "matplotlib",
  "PyYAML",
]

[project.scripts]
airgap-force-fft = "airgap_force_fft:main"

[project.urls]
Homepage = "https://github.com/EMSolution-SSIL/airgap_force_fft"
Repository = "https://github.com/EMSolution-SSIL/airgap_force_fft"
Issues = "https://github.com/EMSolution-SSIL/airgap_force_fft/issues"

[tool.setuptools]
py-modules = ["airgap_force_fft", "airgap_fft", "airgap_io", "airgap_plotting"]
package-dir = {"" = "src"}
