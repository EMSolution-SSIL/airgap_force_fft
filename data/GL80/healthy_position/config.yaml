input:
  path: motorGapB.json
  format: auto
  csv:
    step_col: time
    theta_col: theta_deg
    br_col: Br
    bt_col: Btheta
  sector:
    periods: auto
    angle_deg:
    symmetricity:
    resample_spatial: true
    spatial_samples:

geometry:
  radius_m:
  stack_length_m:

analysis:
  max_order: 120
  max_step_frequency:
  dominant_count: 60
  rotor_speed_rpm:
  include_dc: false
  exclude_time_endpoint_for_fft: true
  torque_reference_json: output_transient.json
  torque_ripple:
    dominant_count: 12
    positive_sign: -1.0
  mode_pair_contributions:
    enabled: true
    target_count: 12
    pairs_per_target: 12

plotting:
  sparse_modes:
    enabled: true
    top_n: 100
    min_relative: 0.02
    max_time_order:
    time_order_min:
    time_order_max:
    space_order_min: 0
    space_order_max:
    positive_space_only: true
    label_top_n: 0
  heatmap:
    enabled: false
  mode_grid:
    enabled: true
    filename: airgap_2d_fft_4panel.png
  torque_comparison:
    enabled: true
    filename: torque_comparison.png

output:
  dir: fft_output


