input:
  path: data/GL80/healthy_position/motorGapB.json
  format: auto
  csv:
    step_col: time
    theta_col: theta_deg
    br_col: Br
    bt_col: Btheta
  sector:
    periods: auto
    angle_deg:
    # JSON input reads postData.gapB.symmetricity when available.
    # CSV input has no metadata, so set this explicitly:
    #   0 = periodic symmetry
    #   1 = anti-periodic symmetry
    # For a full 360-degree CSV, use periods: 1 and symmetricity: 0.
    symmetricity:
    resample_spatial: true
    spatial_samples:

geometry:
  # JSON input can infer radius_m from position.r and stack_length_m from
  # 2 * mean(position.z). CSV input should set both values explicitly.
  radius_m:
  stack_length_m:

analysis:
  max_order: 120
  max_step_frequency:
  dominant_count: 40
  rotor_speed_rpm:
  include_dc: false
  exclude_time_endpoint_for_fft: true
  torque_reference_json: data/GL80/healthy_position/output_transient.json
  torque_ripple:
    dominant_count: 12
    positive_sign: -1.0
  mode_pair_contributions:
    enabled: true
    target_count: 8
    pairs_per_target: 12

plotting:
  sparse_modes:
    enabled: true
    top_n: 80
    min_relative: 0.02
    max_time_order:
    time_order_min:
    time_order_max:
    space_order_min: 0
    space_order_max:
    positive_space_only: true
    label_top_n: 0
  heatmap:
    enabled: false
  mode_grid:
    enabled: true
    filename: airgap_2d_fft_4panel.png
  torque_comparison:
    enabled: true
    filename: torque_comparison.png

output:
  dir: data/GL80/healthy_position/fft_output
